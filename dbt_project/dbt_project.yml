name: 'dbt_project'
version: '1.0.0'
profile: 'dbt_project'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: ["target", "dbt_packages"]

# Business constants used by the models. Kept here (not hard-coded in SQL)
# so every model uses the same values and they are easy to find and change.
vars:
  as_of_date: '2026-06-30'          # reporting date of the loan book
  date_spine_start: '2023-01-01'
  date_spine_end: '2026-12-31'
  # From profiling check P-06: upi_gateway switched to paise from this date.
  upi_paise_source: 'upi_gateway'
  upi_paise_from_date: '2025-10-01'

models:
  dbt_project:
    staging:
      +schema: staging
      +materialized: view        # light, always reflects raw
    intermediate:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table       # dashboards read these, so store them

seeds:
  dbt_project:
    +schema: staging
