version: 2

# Mart tests guarantee what the dashboard reads (severity: error), except two
# business checks marked "warn" whose failures cannot be fixed by transformation.
models:
  # ---------------- Dimensions ----------------
  - name: dim_date
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: dim_branch
    columns:
      - name: branch_id
        data_tests: [unique, not_null]
      - name: state
        data_tests:
          - not_null
          - accepted_values:
              name: dim_branch_state_in_known_list
              arguments:
                values: ['Karnataka', 'Maharashtra', 'Tamil Nadu', 'Odisha', 'Uttar Pradesh', 'Bihar']

  - name: dim_product
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: dim_borrower_segment
    columns:
      - name: segment_id
        data_tests: [unique, not_null]

  - name: dim_channel
    columns:
      - name: channel
        data_tests: [unique, not_null]
      - name: is_digital
        data_tests: [not_null]

  # ---------------- Monthly repayment fact ----------------
  - name: fct_loan_repayment_monthly
    description: "Grain: one row per loan per month-end."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [loan_id, snapshot_month]
      - dbt_utils.expression_is_true:
          name: fct_monthly_outstanding_within_principal
          arguments:
            expression: "principal_outstanding >= 0 and principal_outstanding <= principal_amount"
      - dbt_utils.expression_is_true:
          name: fct_monthly_dpd_not_negative
          arguments:
            expression: "days_past_due >= 0"
      - dbt_utils.expression_is_true:
          name: fct_monthly_paid_not_above_due
          arguments:
            expression: "instalments_paid_cum <= instalments_due_cum"
          # Kept as a warning: the source snapshot is wrong and we must not invent the right value.
          config: {severity: warn, meta: {seeded_issue: SI-09}}
    columns:
      - name: loan_id
        data_tests: [not_null]
      - name: snapshot_month
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_date'), field: date_day}
      - name: disbursement_month
        data_tests:
          - relationships:
              arguments: {to: ref('dim_date'), field: date_day}
      - name: branch_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_branch'), field: branch_id}
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_product'), field: product_id}
      - name: segment_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_borrower_segment'), field: segment_id}
      - name: loan_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACTIVE', 'CLOSED', 'WRITTEN_OFF']

  # ---------------- Transaction fact ----------------
  - name: fct_repayment_transaction
    description: "Grain: one row per valid, de-duplicated payment."
    data_tests:
      - dbt_utils.expression_is_true:
          name: fct_txn_amount_positive
          arguments:
            expression: "amount_inr > 0"
      - dbt_utils.expression_is_true:
          name: fct_txn_not_after_as_of_date
          arguments:
            expression: "txn_date <= date '{{ var('as_of_date') }}'"
    columns:
      - name: txn_id
        data_tests: [unique, not_null]
      - name: loan_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('stg_loans'), field: loan_id}
      - name: txn_date
        data_tests:
          - relationships:
              arguments: {to: ref('dim_date'), field: date_day}
      - name: branch_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_branch'), field: branch_id}
      - name: product_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_product'), field: product_id}
      - name: segment_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_borrower_segment'), field: segment_id}
      - name: channel
        data_tests:
          - relationships:
              arguments: {to: ref('dim_channel'), field: channel}
      - name: is_digital
        data_tests: [not_null]
